[project]
name = "convmd"
version = "0.1.0"
description = "Web to Markdown Toolkit"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28.1",
    "requests>=2.34.2",
    "readability-lxml>=0.8.4.1",
    "markdownify>=1.2.3",
    "firecrawl-anydoc>=0.1.7",
    "markitdown[all]>=0.1.5",
    "beautifulsoup4>=4.15.0",
    "youtube-transcript-api>=1.0.3",
    "google-genai>=2.17.0",
    "pydantic>=2.13.0",
    "pyyaml>=6.0.3",
    "chromadb>=1.5.9",
    "pypdf>=6.15.0",
]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.0.1"]
render = ["playwright>=1.40.0"]
firecrawl = ["firecrawl-py>=4.34.0"]
notebooklm = ["notebooklm-py>=0.4.0"]
image = ["pillow>=12.2.0"]
scripts = ["yt-dlp>=2026.3.17"]
all = [
    "convmd[whisper,render,firecrawl,notebooklm,image,scripts]",
]

[project.scripts]
convmd = "convmd.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-requests>=2.31",
    "types-pyyaml>=6.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
]
ignore = ["C901", "E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
exclude = ["tests/"]

[tool.python_safe_coding]
