[project]
name = "convmd"
version = "0.1.0"
description = "Web to Markdown Toolkit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "readability-lxml>=0.8.1",
    "markdownify>=0.12.1",
    "markitdown>=0.0.1",
    "beautifulsoup4>=4.12.3",
    "youtube-transcript-api>=0.6.2",
    "faster-whisper>=1.0.1",
    "google-genai>=2.0.1",
    "pillow>=12.2.0",
    "notebooklm-py>=0.4.0",
]

[project.scripts]
convmd = "convmd.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
]
ignore = ["C901", "E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
exclude = ["tests/"]

[tool.python_safe_coding]
